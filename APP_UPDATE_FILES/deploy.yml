name: Deploy to Render

on:
  push:
    branches:
      - main
    # an app-only change (mobile_app/) must not restart the website
    paths-ignore:
      - 'mobile_app/**'
      - '.github/workflows/build-app.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
